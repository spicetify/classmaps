name: Index

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: index.json is current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify index
        run: python3 scripts/build_index.py --check
